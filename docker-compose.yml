services:
  postgres:
    image: postgres:15-alpine
    container_name: y3s2-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: y3s2-auth-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_JWT_SECRET: mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789
      APP_JWT_EXPIRATION: 86400000
    ports:
      - "8081:8081"

  patient-service:
    build:
      context: ./backend/patient-service
    container_name: y3s2-patient-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patient_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_JWT_SECRET: mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789
    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: y3s2-api-gateway
    depends_on:
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      APP_JWT_SECRET: mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789
      AUTH_SERVICE_BASE_URL: http://auth-service:8081/api/auth
      PATIENT_SERVICE_BASE_URL: http://patient-service:8082/api/patients
    ports:
      - "8080:8080"

volumes:
  postgres_data:
