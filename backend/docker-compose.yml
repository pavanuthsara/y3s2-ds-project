services:
  # SHARED POSTGRESQL DATABASE
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d
    networks:
      - dsproject-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # API GATEWAY
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_BASE_URL: http://auth-service:8081/api/auth
      PATIENT_SERVICE_BASE_URL: http://patient-service:8082/api/patients
      DOCTOR_SERVICE_BASE_URL: http://doctor-service:8083/api/doctors
      SYMPTOM_CHECKER_SERVICE_BASE_URL: http://ai-symptom-checker:8087/api/symptoms
      APPOINTMENT_SERVICE_BASE_URL: http://appointment-service:8085/api/appointments
      TELEMEDICINE_SERVICE_BASE_URL: http://telemedicine-service:8084/api/telemedicine
      PAYMENT_SERVICE_BASE_URL: http://payment-service:8086/api/payments
      APP_JWT_SECRET: mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789
    depends_on:
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
      ai-symptom-checker:
        condition: service_healthy
      telemedicine-service:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # AUTH SERVICE
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: authdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_JWT_SECRET: mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # PATIENT SERVICE
  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patient_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_JWT_SECRET: mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789
      APPOINTMENT_SERVICE_BASE_URL: http://appointment-service:8085/api/appointments
      PRESCRIPTION_SERVICE_BASE_URL: http://doctor-service:8083/api/prescriptions
      AWS_REGION: eu-north-1
      AWS_S3_BUCKET: patient-reports-damith-001
      AWS_ACCESS_KEY_ID: AKIAXPP4E6ECQL6Z5AE5
      AWS_SECRET_ACCESS_KEY: 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
    depends_on:
      postgres:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # DOCTOR SERVICE
  doctor-service:
    build:
      context: ./doctor-service
      dockerfile: Dockerfile
    container_name: doctor-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/doctor_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # APPOINTMENT SERVICE
  appointment-service:
    build:
      context: ./appointment-service
      dockerfile: Dockerfile
    container_name: appointment-service
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/appointment_service_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # TELEMEDICINE SERVICE
  telemedicine-service:
    build:
      context: ./telemedicine-service
      dockerfile: Dockerfile
    container_name: telemedicine-service
    ports:
      - "8084:8084"
    environment:
      APPOINTMENT_SERVICE_BASE_URL: http://appointment-service:8085/api/appointments
      AGORA_APP_ID: ${AGORA_APP_ID:-a06d1799ced740728903ea9f81f76267}
      AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:-3f928270390a4dd99849834a1bd1c61a}
      AGORA_TOKEN_TTL_SECONDS: ${AGORA_TOKEN_TTL_SECONDS:-3600}
    depends_on:
      appointment-service:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # AI SYMPTOM CHECKER SERVICE
  ai-symptom-checker:
    build:
      context: ./ai-symptom-checker-service
      dockerfile: Dockerfile
    container_name: ai-symptom-checker
    ports:
      - "8087:8087"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      SYMPTOM_MOCK_ENABLED: ${SYMPTOM_MOCK_ENABLED:-true}
    networks:
      - dsproject-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8087/api/symptoms/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  # PAYMENT SERVICE
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payment_service_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789
      STRIPE_SECRET_KEY: sk_test_51TMvcaA621M92XkWJGzMnqZVd9L8ym0EamEll411jtYQZdKhJS3gAa6HSyA8zVJbFFEsrd4WzIf4RkXGtrFal7M9002YvmoSuX
      STRIPE_WEBHOOK_SECRET: whsec_test_secret
      STRIPE_PUBLISHABLE_KEY: pk_test_51TMvcaA621M92XkWlrbInOEX3DYU57VAomEhoDr2ua3WZ5FziPiqDHT5lVLkuM8Js0sZeVo8v0vtjxn6fYgrkMvq00wnPkO2EX
      NOTIFICATION_SERVICE_URL: http://notification-service:8088/api/notifications
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # NOTIFICATION SERVICE
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8088:8088"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notification_service_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@ds-project.local}
      PATIENT_SERVICE_URL: http://patient-service:8082/api/patients
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  dsproject-network:
    driver: bridge

volumes:
  postgres_data:
