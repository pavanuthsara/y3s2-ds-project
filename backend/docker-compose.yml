services:
  # ──────────────────────────────
  # API GATEWAY
  # ──────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - ai-symptom-checker
    networks:
      - dsproject-network

  # ──────────────────────────────
  # AUTH SERVICE
  # ──────────────────────────────
  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - dsproject-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: auth-postgres
      DB_PORT: 5432
      DB_NAME: authdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - dsproject-network

  # ──────────────────────────────
  # AI SYMPTOM CHECKER SERVICE
  # ──────────────────────────────
  ai-symptom-checker:
    build:
      context: ./ai-symptom-checker-service
      dockerfile: Dockerfile
    container_name: ai-symptom-checker
    ports:
      - "8087:8087"
    environment:
      GEMINI_API_KEY: AQ.Ab8RN6IDXVyoozfkIVAQ_4ChgSxEaqiUF7QbOkxAb_doFadr4g
    networks:
      - dsproject-network

# ──────────────────────────────
# SHARED NETWORK & VOLUMES
# ──────────────────────────────
networks:
  dsproject-network:
    driver: bridge

volumes:
  auth_postgres_data:
