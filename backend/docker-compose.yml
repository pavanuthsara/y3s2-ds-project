services:
  # API GATEWAY
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_BASE_URL: http://auth-service:8081/api/auth
      PATIENT_SERVICE_BASE_URL: http://patient-service:8082/api/patients
      DOCTOR_SERVICE_BASE_URL: http://doctor-service:8083/api/doctors
      SYMPTOM_CHECKER_SERVICE_BASE_URL: http://ai-symptom-checker:8087/api/symptoms
      APPOINTMENT_SERVICE_BASE_URL: http://appointment-service:8085/api/appointments
      TELEMEDICINE_SERVICE_BASE_URL: http://telemedicine-service:8084/api/telemedicine
      PAYMENT_SERVICE_BASE_URL: http://payment-service:8086/api/payments
      APP_JWT_SECRET: mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789
    depends_on:
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
      ai-symptom-checker:
        condition: service_healthy
      telemedicine-service:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # AUTH SERVICE
  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - dsproject-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: auth-postgres
      DB_PORT: 5432
      DB_NAME: authdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_JWT_SECRET: mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # PATIENT SERVICE
  patient-postgres:
    image: postgres:16-alpine
    container_name: patient-postgres
    environment:
      POSTGRES_DB: patient_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - patient_postgres_data:/var/lib/postgresql/data
    networks:
      - dsproject-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-postgres:5432/patient_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_JWT_SECRET: mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789
      APPOINTMENT_SERVICE_BASE_URL: http://appointment-service:8085/api/appointments
      PRESCRIPTION_SERVICE_BASE_URL: http://doctor-service:8083/api/prescriptions
      AWS_REGION: eu-north-1
      AWS_S3_BUCKET: patient-reports-damith-001
      AWS_ACCESS_KEY_ID: AKIAXPP4E6ECQL6Z5AE5
      AWS_SECRET_ACCESS_KEY: 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
    depends_on:
      patient-postgres:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # DOCTOR SERVICE
  doctor-postgres:
    image: postgres:16-alpine
    container_name: doctor-postgres
    environment:
      POSTGRES_DB: doctor_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - doctor_postgres_data:/var/lib/postgresql/data
    networks:
      - dsproject-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  doctor-service:
    build:
      context: ./doctor-service
      dockerfile: Dockerfile
    container_name: doctor-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://doctor-postgres:5432/doctor_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      doctor-postgres:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # APPOINTMENT SERVICE
  appointment-postgres:
    image: postgres:16-alpine
    container_name: appointment-postgres
    environment:
      POSTGRES_DB: appointment_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - appointment_postgres_data:/var/lib/postgresql/data
    networks:
      - dsproject-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  appointment-service:
    build:
      context: ./appointment-service
      dockerfile: Dockerfile
    container_name: appointment-service
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://appointment-postgres:5432/appointment_service_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      appointment-postgres:
        condition: service_healthy
    networks:
      - dsproject-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

