spring.application.name=telemedicine-service
server.port=8084

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Appointment service used to validate confirmed appointments
appointment.service.base-url=${APPOINTMENT_SERVICE_BASE_URL:http://appointment-service:8085/api/appointments}

# Agora integration settings
agora.app-id=${AGORA_APP_ID:demo-app-id}
agora.app-certificate=${AGORA_APP_CERTIFICATE:demo-app-certificate}
agora.token-ttl-seconds=${AGORA_TOKEN_TTL_SECONDS:3600}
