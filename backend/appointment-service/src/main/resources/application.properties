# =====================================================================
# Appointment Service Configuration
# =====================================================================
spring.application.name=appointment-service
server.port=8085

# =====================================================================
# Database Configuration (PostgreSQL)
# Uses environment variable DB_URL for container overrides,
# falls back to localhost for local development.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/appointment_service_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================================
# JPA / Hibernate Configuration
# =====================================================================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================================
# Actuator Configuration
# Expose health and info endpoints for monitoring
# =====================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# =====================================================================
# Error Handling
# Include error messages and binding errors in responses
# =====================================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =====================================================================
# Inter-service Communication
# =====================================================================
services.doctor.base-url=${DOCTOR_SERVICE_URL:http://localhost:8081/api/doctors}