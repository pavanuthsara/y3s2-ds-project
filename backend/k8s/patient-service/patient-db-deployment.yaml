apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-db
  labels:
    app: patient-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-db
  template:
    metadata:
      labels:
        app: patient-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: patient-config
              key: DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: patient-config
              key: DB_USERNAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: patient-secret
              key: DB_PASSWORD
        volumeMounts:
        - name: patient-db-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: patient-db-storage
        emptyDir: {}
