apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-symptom-config
  namespace: default
data:
  GEMINI_MODEL: gemini-2.5-flash
  SYMPTOM_MOCK_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-symptom-secret
  namespace: default
type: Opaque
data:
  # Provide your real base64-encoded Gemini API key below.
  # Generate it with: echo -n "your-api-key" | base64
  # Leave as empty string only if SYMPTOM_MOCK_ENABLED is "true" AND the service
  # does NOT validate the key at startup (check your service code).
  GEMINI_API_KEY: ""
