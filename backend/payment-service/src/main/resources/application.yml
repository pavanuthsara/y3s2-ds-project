spring:
  application:
    name: payment-service
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_service_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

server:
  port: 8086
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Stripe Configuration
stripe:
  api-key: ${STRIPE_SECRET_KEY:sk_test_51234567890}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_1234567890}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_1234567890}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789}
  expiration: ${JWT_EXPIRY_MS:3600000}

# Notification Service
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8088/api/notifications}

# Logging
logging:
  level:
    root: INFO
    com.se73.payment_service: DEBUG
    org.springframework.security: DEBUG
