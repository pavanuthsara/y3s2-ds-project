spring:
  application:
    name: payment-service
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  datasource:
    url: jdbc:h2:mem:payment_test_db
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  
server:
  port: 8086
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Stripe Configuration
stripe:
  api-key: ${STRIPE_SECRET_KEY:sk_test_51234567890}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_1234567890}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_1234567890}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789}
  expiration: ${JWT_EXPIRY_MS:3600000}

# Logging
logging:
  level:
    root: INFO
    com.se73.payment_service: DEBUG
    org.springframework.security: DEBUG
