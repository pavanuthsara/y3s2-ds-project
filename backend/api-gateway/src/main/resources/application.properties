# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:mySecretKeyForJwtTokenGenerationAndValidationPurposesOnly123456789}

services.auth.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8081/api/auth}
services.patient.base-url=${PATIENT_SERVICE_BASE_URL:http://localhost:8082/api/patients}
services.doctor.base-url=${DOCTOR_SERVICE_BASE_URL:http://localhost:8083/api/doctors}
services.symptom-checker.base-url=${SYMPTOM_CHECKER_SERVICE_BASE_URL:http://localhost:8087/api/symptoms}
services.appointment.base-url=${APPOINTMENT_SERVICE_BASE_URL:http://localhost:8085/api/appointments}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG

# Error Response Configuration
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

